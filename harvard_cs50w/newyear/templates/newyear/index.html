<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is it New Year ?</title>
</head>

<body>
    {% if newyear %}
    <h1>Yes!</h1>
        <h1>Happy New Year!</h1>
        <p>It's {{ year }}!</p>
    {% else %}
        <h1>No!</h1>
        <p>It's not New Year yet!</p>
        <p>It's {{ day }} / {{ month }} / {{ year }} !</p>
    {% endif %}
</body>
</html>
