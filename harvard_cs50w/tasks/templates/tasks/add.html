{% extends "tasks/layout.html" %}

{% block title %} Add Task {% endblock %}

{% block body %}
    <h1>Add Task</h1>
    <form action="{% url 'tasks:add' %}" method="post">
        {% csrf_token %}
        <input type="text" name="task">
        <input type="submit">
    </form>

    <a href="{% url 'tasks:index' %}">Back to Tasks</a>

{% endblock %}
